<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>🧪 PixiJS 垂直切片 · 擦炮虫虫实验室</title>
  <script type="importmap">
    { "imports": { "pixi.js": "/node_modules/pixi.js/dist/pixi.min.mjs" } }
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: #0b0e14; color: #e8e6e3;
      font: 14px/1.6 system-ui, 'Segoe UI', sans-serif;
    }
    header h1 {
      margin: 0 0 4px; font-size: 20px;
      background: linear-gradient(90deg, #ffd27a, #ff8a5c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { margin: 0 0 12px; color: #9aa0ab; max-width: 960px; }
    header a { color: #7ab8ff; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    main { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    #stage { flex: 0 1 auto; min-width: 0; }
    #stage canvas { max-width: 100%; height: auto; display: block; border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.55); }
    #panel {
      flex: 1 0 240px; max-width: 320px; padding: 14px 16px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
    }
    #panel h2 { margin: 0 0 8px; font-size: 13px; color: #9aa0ab; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; }
    .stat { display: flex; justify-content: space-between; padding: 3px 0; }
    .stat b { font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 8px; margin: 12px 0 6px; }
    button {
      flex: 1; padding: 9px 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      color: inherit; font: inherit; cursor: pointer;
      transition: transform .08s ease, background .15s ease;
    }
    button:hover { background: rgba(255,255,255,.12); }
    button:active { transform: translateY(1px) scale(.98); }
    #ignite { border-color: rgba(255,120,60,.45); }
    #status { margin-top: 8px; color: #9aa0ab; font-size: 12.5px; }
    #checksum { margin-top: 6px; font-family: ui-monospace, Consolas, monospace;
      font-size: 12px; color: #8fd694; word-break: break-all; display: none; }
    kbd { padding: 1px 5px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px;
      font-size: 11px; background: rgba(255,255,255,.06); }
    #err { color: #ff8a8a; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>🧪 PixiJS 垂直切片 —— 案例1 · 连环风暴</h1>
    <p>
      引擎选型 A/B 实验件（09-17 决策落地）：sim 层一字未动，用 PixiJS 重做同一场景的表现层 ——
      真 sprite 纹理（预渲染位图替代逐帧矢量）、加法辉光粒子、大威力顿帧、震屏与镜头 punch、
      屏幕空间畸变冲击波（自定义 shader）。同 seed=4103、同点燃节奏，灾难应与 Canvas 版逐位一致。
      <a href="/index.html">↩ 返回 Canvas 版对照</a>
    </p>
  </header>
  <main>
    <div id="stage"></div>
    <aside id="panel">
      <h2>实时统计</h2>
      <div class="stat"><span>💥 爆炸</span><b id="st-exp">0</b></div>
      <div class="stat"><span>🔗 连锁</span><b id="st-chain">×0</b></div>
      <div class="stat"><span>🪳 击倒</span><b id="st-ko">0</b></div>
      <div class="stat"><span>🎯 一爆多杀</span><b id="st-multi">0</b></div>
      <div class="stat"><span>⏱ 实测</span><b id="st-perf">—</b></div>
      <div class="row">
        <button id="ignite">🔥 点燃！ <kbd>空格</kbd></button>
        <button id="reset">↺ 重置 <kbd>R</kbd></button>
      </div>
      <div id="status">加载中…</div>
      <div id="checksum"></div>
      <div id="err"></div>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
